<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source for og-image.png. Re-render at exactly 1200x630, e.g. headless Chrome:
     chrome --headless --window-size=1200,630 --screenshot=og-image.png og-image-template.html -->
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@1,400&family=Sora:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #15181f;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #ece4d6;
  }
  .wordmark { width: 668px; height: 212px; display: block; margin-top: 10px; }  /* 2x the 334x106 master */
  .subtitle {
    font: italic 400 30px/1.3 'Inter', sans-serif;
    color: #a39e95;
    margin: 30px 0 0;
  }
  .url {
    position: absolute; bottom: 38px; left: 0; right: 0; text-align: center;
    font: 500 17px 'Sora', sans-serif; letter-spacing: .14em; text-transform: uppercase;
    color: #6f6b65;
  }
</style>
</head>
<body>
  <img class="wordmark" src="wordmark-dark.svg" alt="">
  <p class="subtitle">when your devices get more sleep than game time</p>
  <div class="url">pipeton8.github.io/rest-mode</div>
</body>
</html>
