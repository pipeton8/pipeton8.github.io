{% set root = "../" * depth %}
{% set site_root = "../" * (depth + 1) %}
<!DOCTYPE html>
<html lang="en" dir="ltr">

<!-- Generated by _rest-mode/build.py; edit the templates/content there, not this file. -->
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      document.documentElement.classList.add('js');
      try {
        if (localStorage.getItem('restModeColorMode') === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
  <title>{% block title %}rest mode{% endblock %}</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block description %}Game reviews for people with limited time.{% endblock %}">
  <meta name="keywords" content="{% block keywords %}game reviews, short gaming sessions, limited time, video games{% endblock %}">
  <link rel="canonical" href="{% block canonical %}{{ site_url }}{% endblock %}">

  <!-- Social preview (Open Graph / Twitter) -->
  <meta property="og:site_name" content="rest mode">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ self.canonical() }}">
  <meta property="og:image" content="{% block og_image %}https://pipeton8.github.io/icons/rest-mode/og-image.png{% endblock %}">
  <meta property="og:image:alt" content="{% block og_image_alt %}The rest mode wordmark with its glowing amber strip on a dark slate background{% endblock %}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ self.title() }}">
  <meta name="twitter:description" content="{{ self.description() }}">
  <meta name="twitter:image" content="{{ self.og_image() }}">

  <!-- Icons -->
  <link rel="icon" href="{{ site_root }}icons/rest-mode/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site_root }}icons/rest-mode/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site_root }}icons/rest-mode/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ site_root }}icons/rest-mode/apple-touch-icon.png">
  <link rel="manifest" href="{{ site_root }}icons/rest-mode/site.webmanifest">
  <meta name="theme-color" content="#15181f">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;1,400&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ root }}css/rest-mode.css">

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/d1e054ce54.js" crossorigin="anonymous"></script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C1ECHGQLBQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-C1ECHGQLBQ');
  </script>
</head>

<body class="blog-body page-{{ page }}">

  <!-- Navigation -->
  <nav class="blog-nav" id="blog-nav">
    <div class="blog-nav-container">
      <a href="{{ root }}index.html" class="blog-nav-brand" aria-label="rest mode home">
        <span class="rm-wordmark rm-wordmark--nav" id="nav-wordmark">
          <span class="rm-wordmark-text">rest mode</span>
          <span class="rm-strip" aria-hidden="true"></span>
        </span>
      </a>
      <div class="blog-nav-right">
        <ul class="blog-nav-links" id="blog-nav-links">
          <li><a href="{{ root }}index.html#reviews">Reviews</a></li>
          <li><a href="{{ root }}about.html">About</a></li>
        </ul>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle color theme" onclick="toggleColorMode()">
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <i class="fas fa-moon icon-moon" aria-hidden="true"></i>
        </button>
        <button class="nav-menu-btn" aria-label="Open menu" aria-controls="blog-nav-links" aria-expanded="false" onclick="toggleNavMenu()">
          <span class="menu-bar"></span>
          <span class="menu-bar"></span>
        </button>
      </div>
    </div>
  </nav>

{% block content %}{% endblock %}

  <!-- Footer -->
  <footer class="blog-footer">
    <p>
      rest mode &mdash; a gaming blog by <a href="{{ site_root }}index.html">Felipe del Canto</a>
    </p>
  </footer>

  <script src="{{ root }}scripts/rest-mode.js"></script>

</body>
</html>
